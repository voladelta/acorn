[package]
name = "acorn-telegram"
description = "Acorn on Telegram: the Telegram App assistant, its chat in your DM with the bot, the groups it hears"
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false

[dependencies]
acorn-core = { path = "../../core" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-util = "0.3"
parking_lot = "0.13"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"

[dev-dependencies]
tempfile = "3"
