[package]
name = "acorn-server"
description = "Acorn's engines on this machine, its window in a browser"
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
acorn-core = { path = "../core" }
acorn-telegram = { path = "../bridges/telegram" }
axum = "0.8"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs", "compression-gzip"] }
