[package]
name = "acorn-web"
description = "Acorn's window in a browser: the app built for WebAssembly"
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

# Empty off WebAssembly.
[target.'cfg(target_arch = "wasm32")'.dependencies]
acorn = { path = "../app" }
nsh-base = "0.4.0"
nsh-core = "0.4.0"
nsh-platform-web = { version = "0.4.0", default-features = false }
