<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Acorn</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  @media (prefers-color-scheme: dark) { html, body { background: #1c1c1e; } }
  #app { position: fixed; inset: 0; }
  #status { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #8a8a8e; }
</style>
</head>
<body>
<div id="app"></div>
<div id="status">Loading…</div>
<script type="module">
  import { createPlayer } from "./nsh.js";
  const status = document.getElementById("status");
  try {
    const player = await createPlayer(document.getElementById("app"), {
      wasm: "./acorn.wasm",
      idiom: "desktop",
      onError: (message) => console.error(message),
    });
    status.remove();
    player.runRust();
  } catch (err) {
    status.textContent = String(err.message ?? err);
  }
</script>
</body>
</html>
