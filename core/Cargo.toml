[package]
name = "acorn-core"
description = "Acorn's engine: one endless chat, its memory tree, the agent and its tools"
edition.workspace = true
license.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
# The engine: chats, memory, the agent and its tools, on this machine.
# Without it, only what the app and the engine say to each other
# (`wire` and its types), which builds for the web.
default = ["engine"]
engine = ["dep:anyhow", "dep:cfb", "dep:futures-util", "dep:image", "dep:libc", "dep:mlua", "dep:parking_lot", "dep:rand", "dep:reqwest", "dep:rusqlite", "dep:sha2", "dep:tokio", "dep:tokio-util", "dep:zip", "chrono/clock"]

[dependencies]
anyhow = { version = "1", optional = true }
base64 = "0.23"
cfb = { version = "0.16", optional = true }
chrono = { version = "0.4", default-features = false, features = ["std"] }
futures-util = { version = "0.3", optional = true }
image = { optional = true, version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
libc = { version = "0.2", optional = true }
mlua = { optional = true, version = "0.12", features = ["luau", "async", "serialize", "send"] }
parking_lot = { version = "0.13", optional = true }
rand = { version = "0.10", optional = true }
reqwest = { optional = true, version = "0.13", default-features = false, features = ["rustls", "stream", "json", "query"] }
rusqlite = { optional = true, version = "0.41.1", features = ["bundled", "fallible_uint"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = { version = "0.11", optional = true }
tokio = { optional = true, version = "1", features = ["full"] }
tokio-util = { version = "0.7", optional = true }
zip = { optional = true, version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
