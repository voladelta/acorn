[package]
name = "acorn"
description = "Acorn: one chat that never ends, kept in a memory tree"
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false

[dependencies]
acorn-core = { path = "../core", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["std"] }
nsh-base = "0.4.0"
nsh-core = "0.4.0"
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["sync"] }

# On this machine the engines run in the window's process; on the web,
# in `acorn-server` (`link`).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
acorn-core = { path = "../core", features = ["engine"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
env_logger = "0.11"
mimalloc = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.4.0", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.4.0", default-features = false }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
nsh-engine = "0.4.0"
nsh-testing = "0.4.0"
tempfile = "3"
